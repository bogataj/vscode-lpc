name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.os }} / VS Code ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: stable
            package: true
          # Oldest version allowed by engines.vscode.
          - os: ubuntu-latest
            vscode: 1.74.0
          - os: windows-latest
            vscode: stable
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm audit --audit-level=high
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm test
          else
            npm test
          fi
      - if: matrix.package
        run: npm run package -- --out vscode-lpc.vsix

  # The branch ruleset requires a status check named "test"; this job reports
  # the result of the whole matrix under that name.
  test:
    if: always()
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
        run: test "$MATRIX_RESULT" = "success"
