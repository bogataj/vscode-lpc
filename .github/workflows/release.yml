name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to validate and publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Validate release tag
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify npm registry signatures
        run: npm audit signatures
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run tests
        run: xvfb-run -a npm test
      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$RELEASE_TAG"
      - name: Package extension
        run: npm run package -- --out "lpc-ldmud-lp245-${{ steps.metadata.outputs.version }}.vsix"
      - name: Record package checksum
        shell: bash
        run: |
          sha256sum "lpc-ldmud-lp245-${{ steps.metadata.outputs.version }}.vsix" \
            > "lpc-ldmud-lp245-${{ steps.metadata.outputs.version }}.vsix.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.metadata.outputs.version }}
          path: |
            lpc-ldmud-lp245-${{ steps.metadata.outputs.version }}.vsix
            lpc-ldmud-lp245-${{ steps.metadata.outputs.version }}.vsix.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.validate.outputs.version }}
          path: release
      - name: Verify package checksum
        shell: bash
        working-directory: release
        run: sha256sum --check "lpc-ldmud-lp245-${{ needs.validate.outputs.version }}.vsix.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.validate.outputs.version }}"
          gh release create "${{ needs.validate.outputs.tag }}" \
            "release/lpc-ldmud-lp245-${version}.vsix" \
            "release/lpc-ldmud-lp245-${version}.vsix.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${{ needs.validate.outputs.tag }}: LPC Language Support" \
            --generate-notes
